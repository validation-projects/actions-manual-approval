name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Semantic release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release
          tag="$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          if [ -n "$tag" ]; then
            echo "Released $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "major=${tag%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "No new release."
          fi

      - name: Update floating major tag
        if: steps.semantic-release.outputs.tag != ''
        env:
          TAG: ${{ steps.semantic-release.outputs.tag }}
          MAJOR: ${{ steps.semantic-release.outputs.major }}
        run: |
          git tag -f "$MAJOR" "$TAG^{commit}"
          git push -f origin "refs/tags/$MAJOR"
