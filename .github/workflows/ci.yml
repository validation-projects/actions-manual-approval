name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --coverage

      - name: Build
        run: npm run build

      - name: Check dist/ is up to date
        run: |
          if ! git diff --exit-code --stat dist/; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard dist/)"
          if [ -n "$untracked" ]; then
            echo "::error::dist/ has files not committed to the repository. Run 'npm run build' and commit the result."
            echo "$untracked"
            exit 1
          fi
