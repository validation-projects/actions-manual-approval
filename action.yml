name: 'Cancelable Environment Wait Timer'
description: >-
  Replaces the native environment wait timer with a timer that stops as soon as a
  required reviewer approves the deployment. When the timer expires without an
  approval, the configured default action (approve or cancel) is executed.
author: 'validation-projects'
branding:
  icon: 'clock'
  color: 'blue'

inputs:
  wait-timer:
    description: 'Time to wait for a required reviewer approval, in minutes (positive integer).'
    required: true
  default-action:
    description: 'Action executed when the timer expires without approval: "approve" or "cancel".'
    required: true
  user-token:
    description: >-
      Personal access token of a required reviewer. Used to poll the run and to approve the
      pending deployment through the pending deployments API. Mutually exclusive with app-token.
    required: false
  app-token:
    description: >-
      Installation token of the GitHub App configured as custom deployment protection rule,
      generated in a previous step with actions/create-github-app-token@v3. Used to poll the run
      and to approve the protection rule. Installation tokens expire after 1 hour and are not
      renewed by the action, so the token must remain valid for the full wait timer.
      Mutually exclusive with user-token.
    required: false
  environment:
    description: >-
      Name of the target environment whose pending deployment should be watched. When empty,
      every pending deployment of the current run is watched.
    required: false
    default: ${{ github.event.deployment.environment }}
  poll-interval:
    description: 'Polling interval in seconds (integer between 5 and 300).'
    required: false
    default: '30'

outputs:
  result:
    description: >-
      Outcome of the action: "approved" (a required reviewer approved before the timer expired),
      "rejected" (a required reviewer rejected), "auto-approved" (timer expired and default-action
      approved) or "cancelled" (timer expired and default-action cancelled the run).

runs:
  using: 'node24'
  main: 'dist/index.js'
